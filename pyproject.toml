[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-debugger-mcp"
version = "0.1.0"
description = "MCP Server for LLDB-based process debugging and Mach VM memory telemetry on macOS (Apple Silicon ARM64)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Molzard" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
macos-debugger-mcp = "macos_debugger_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_debugger_mcp"]
